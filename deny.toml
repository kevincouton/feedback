# cargo-deny configuration for the feedback-server binary.
# Mirrors gittrend api-rs deny.toml (the fleet's existing expectations).

[advisories]
# Fail on any security advisory in the RustSec database.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    # Used by webpki-roots (via reqwest rustls trust anchors).
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
